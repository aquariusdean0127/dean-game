<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>SCATTER — Slot</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{ --cell:64px; --gap:8px; }
  html,body{height:100%}
  body{
    background:
      radial-gradient(circle at 50% -10%, #2a1a5e 0%, #120b28 40%, #060410 75%, #030209 100%);
    color:#eae7ff;
    font-family: ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, #8fb8ff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 70% 15%, #c9a6ff 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 85% 60%, #9be7ff 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 35% 75%, #ffd1f0 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 55% 45%, #ffffff 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 10% 85%, #a6c8ff 50%, transparent 51%);
  }

  .app{
    position:relative; display:flex; flex-direction:column; align-items:center;
    gap:12px; padding:16px; width:100%; max-width:640px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:0 4px;
  }
  .logo{
    font-size:20px; font-weight:900; letter-spacing:.22em; margin-left:.22em;
    background:linear-gradient(180deg,#fff,#9b7bff 60%,#5ce1ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(140,110,255,.55));
  }
  .balance{display:flex; flex-direction:column; align-items:flex-end; line-height:1.1}
  .balance span{font-size:9px; letter-spacing:.26em; color:#8b7fc4; font-weight:800}
  .balance strong{
    font-size:20px; font-weight:900; font-variant-numeric:tabular-nums;
    color:#eafcff; text-shadow:0 0 16px rgba(92,225,255,.55);
  }
  .balance.flash strong{ animation:balflash .55s ease }
  @keyframes balflash{ 0%{transform:scale(1)} 35%{transform:scale(1.14); color:#9dffb8} 100%{transform:scale(1)} }

  .icon-btn{
    width:34px; height:34px; border-radius:50%; cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid rgba(155,123,255,.35);
    color:#b9a8ff; font-weight:900; font-size:15px; font-family:Georgia,serif;
    transition:.2s; flex:0 0 auto;
  }
  .icon-btn:hover{background:rgba(155,123,255,.22); color:#fff}

  /* ---------- Free spin badge ---------- */
  .fs-badge{
    display:none; align-items:center; gap:10px;
    padding:7px 20px; border-radius:999px;
    background:linear-gradient(90deg, rgba(255,80,180,.22), rgba(255,190,80,.22));
    border:1px solid rgba(255,150,220,.5);
    box-shadow:0 0 26px rgba(255,90,190,.4);
    font-size:11px; letter-spacing:.24em; font-weight:900; color:#ffd6f4;
    animation:fsPulse 1.4s ease-in-out infinite;
  }
  .fs-badge.show{display:flex}
  .fs-badge b{
    font-size:17px; letter-spacing:0; color:#fff;
    text-shadow:0 0 14px rgba(255,220,120,.9);
  }
  @keyframes fsPulse{ 0%,100%{box-shadow:0 0 20px rgba(255,90,190,.35)} 50%{box-shadow:0 0 38px rgba(255,140,220,.75)} }

  /* ---------- Machine ---------- */
  .machine{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:14px; border-radius:26px;
    background:linear-gradient(180deg, rgba(38,26,74,.9), rgba(13,9,30,.94));
    border:1px solid rgba(155,123,255,.28);
    box-shadow:
      0 0 70px rgba(120,70,255,.28),
      0 20px 50px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.09);
  }

  .reels{
    display:flex; gap:var(--gap); padding:var(--gap); border-radius:18px;
    background:rgba(0,0,0,.5);
    border:1px solid rgba(140,110,255,.18);
    box-shadow:inset 0 0 40px rgba(0,0,0,.9), inset 0 0 12px rgba(90,60,200,.25);
  }

  .reel{
    position:relative; width:var(--cell); height:calc(var(--cell) * 3);
    overflow:hidden; border-radius:12px;
    background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.012));
    box-shadow:inset 0 0 14px rgba(0,0,0,.7);
  }
  .reel::after{
    content:''; position:absolute; inset:0; pointer-events:none; border-radius:12px;
    background:linear-gradient(180deg, rgba(0,0,0,.45), transparent 22%, transparent 78%, rgba(0,0,0,.45));
  }
  .strip{ will-change:transform; }
  .cell{
    height:var(--cell); display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .glyph{
    font-size:calc(var(--cell) * 0.56); line-height:1;
    filter:drop-shadow(0 0 10px currentColor);
    transition:transform .18s;
  }
  .reel.spinning .strip{ filter:blur(2.5px) brightness(1.2) saturate(1.3) }
  .reel.spinning .cell{ opacity:.9 }

  .cell.win::before{
    content:''; position:absolute; inset:3px; border-radius:11px; z-index:0;
    background:radial-gradient(circle, rgba(255,215,100,.45), rgba(255,160,60,.12) 60%, transparent 75%);
    box-shadow:0 0 26px rgba(255,200,80,.85), inset 0 0 20px rgba(255,225,140,.6);
    animation:winPulse .75s ease-in-out infinite alternate;
  }
  @keyframes winPulse{ from{opacity:.45} to{opacity:1} }
  .cell.win .glyph{ transform:scale(1.16) }

  .win-msg{
    height:32px; display:flex; align-items:center; justify-content:center;
    font-weight:900; letter-spacing:.16em; font-size:17px; margin-left:.16em;
    color:#ffd166; text-shadow:0 0 22px rgba(255,200,80,.85);
    opacity:0; transform:translateY(8px); transition:opacity .25s, transform .25s;
    white-space:nowrap;
  }
  .win-msg.show{opacity:1; transform:translateY(0)}
  .win-msg.big{ font-size:21px; color:#ff9ee6; text-shadow:0 0 26px rgba(255,120,220,.9) }

  /* ---------- Controls ---------- */
  .controls{
    width:100%; display:flex; align-items:center; justify-content:center; gap:16px;
    padding:2px 4px 4px;
  }
  .bet-box{
    display:flex; align-items:center; gap:6px;
    padding:6px; border-radius:16px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(155,123,255,.22);
  }
  .step{
    width:34px; height:34px; border-radius:11px; cursor:pointer;
    background:rgba(155,123,255,.16); border:1px solid rgba(155,123,255,.35);
    color:#d9ccff; font-size:19px; font-weight:800; line-height:1;
    transition:.15s; display:grid; place-items:center; padding-bottom:2px;
  }
  .step:hover{background:rgba(155,123,255,.34); color:#fff}
  .step:active{transform:scale(.92)}
  .step:disabled{opacity:.32; cursor:not-allowed}
  .bet-amt{display:flex; flex-direction:column; align-items:center; min-width:74px; line-height:1.15}
  .bet-amt span{font-size:8.5px; letter-spacing:.24em; color:#8b7fc4; font-weight:800}
  .bet-amt strong{font-size:16px; font-weight:900; color:#eafcff; font-variant-numeric:tabular-nums}

  .spin-btn{
    width:78px; height:78px; border-radius:50%; cursor:pointer; flex:0 0 auto;
    border:2px solid rgba(255,255,255,.22);
    background:linear-gradient(160deg,#7b5cff,#c04bff 45%,#ff3ea5);
    color:#fff; font-weight:900; font-size:12.5px; letter-spacing:.16em;
    box-shadow:0 0 34px rgba(160,80,255,.7), 0 8px 22px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.35);
    transition:transform .14s, box-shadow .14s, filter .14s;
    display:grid; place-items:center;
  }
  .spin-btn:hover{transform:translateY(-2px) scale(1.03); box-shadow:0 0 50px rgba(190,100,255,.9), 0 10px 26px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.4)}
  .spin-btn:active{transform:scale(.94)}
  .spin-btn:disabled{filter:grayscale(.65) brightness(.62); cursor:not-allowed; transform:none; box-shadow:0 0 18px rgba(120,70,200,.35)}
  .spin-btn.free{ background:linear-gradient(160deg,#ffb347,#ff5ea8 55%,#c04bff) }

  /* ---------- Modal ---------- */
  .modal{
    position:fixed; inset:0; z-index:30; display:none; place-items:center; padding:20px;
    background:rgba(4,2,12,.82); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  }
  .modal.show{display:grid}
  .modal-card{
    width:100%; max-width:400px; max-height:82vh; overflow-y:auto;
    padding:22px; border-radius:22px;
    background:linear-gradient(180deg, rgba(38,26,74,.98), rgba(13,9,30,.99));
    border:1px solid rgba(155,123,255,.4);
    box-shadow:0 0 70px rgba(120,70,255,.4);
    animation:pop .22s ease;
  }
  @keyframes pop{ from{transform:scale(.94); opacity:0} to{transform:scale(1); opacity:1} }
  .modal-card h3{
    font-size:13px; letter-spacing:.28em; color:#b9a8ff; margin-bottom:16px; font-weight:900;
    display:flex; justify-content:space-between; align-items:center;
  }
  .modal-card h3 button{
    background:none; border:none; color:#8b7fc4; font-size:22px; cursor:pointer; line-height:1;
    padding:0 4px;
  }
  .pt-row{
    display:flex; align-items:center; gap:10px; padding:7px 0;
    border-bottom:1px solid rgba(155,123,255,.12);
  }
  .pt-row:last-child{border-bottom:none}
  .pt-glyph{font-size:20px; width:26px; text-align:center; filter:drop-shadow(0 0 8px currentColor)}
  .pt-name{flex:1; font-size:11px; letter-spacing:.14em; color:#9a8fd0; font-weight:800; text-transform:uppercase}
  .pt-pays{font-size:11.5px; color:#cfe6ff; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.03em}
  .pt-scatter{
    margin-top:14px; padding:12px; border-radius:14px;
    background:rgba(192,132,252,.12); border:1px solid rgba(192,132,252,.4);
    font-size:11px; line-height:1.75; color:#d9ccff; letter-spacing:.04em;
  }
  .pt-scatter b{color:#fff}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,16px); z-index:40;
    padding:11px 24px; border-radius:999px; font-size:12px; font-weight:800; letter-spacing:.1em;
    background:rgba(30,18,60,.96); border:1px solid rgba(155,123,255,.5); color:#e6ddff;
    opacity:0; pointer-events:none; transition:.28s;
    box-shadow:0 0 30px rgba(120,70,255,.4);
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}

  @media (max-height:700px){
    .app{gap:8px; padding:10px}
    .machine{padding:11px}
    .spin-btn{width:68px; height:68px; font-size:11.5px}
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="logo">SCATTER</div>
    <div class="balance" id="balBox">
      <span>BALANCE</span>
      <strong id="balance">$1,000.00</strong>
    </div>
    <button class="icon-btn" id="infoBtn" aria-label="Paytable">i</button>
  </header>

  <div class="fs-badge" id="fsBadge">
    <span>FREE SPINS</span><b id="fsCount">0</b>
  </div>

  <main class="machine">
    <div class="reels" id="reels"></div>
    <div class="win-msg" id="winMsg"></div>
  </main>

  <footer class="controls">
    <div class="bet-box">
      <button class="step" id="betDown">−</button>
      <div class="bet-amt">
        <span>BET</span>
        <strong id="betAmt">$1.00</strong>
      </div>
      <button class="step" id="betUp">+</button>
    </div>
    <button class="spin-btn" id="spinBtn"><span>SPIN</span></button>
  </footer>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h3>PAYTABLE <button id="closeModal">×</button></h3>
    <div id="ptBody"></div>
    <div class="pt-scatter">
      <b>🌀 SCATTER</b> — pays anywhere.<br>
      3 → <b>2×</b> bet &nbsp;·&nbsp; 4 → <b>10×</b> &nbsp;·&nbsp; 5 → <b>50×</b><br>
      3+ scatters award <b>10 / 15 / 25 FREE SPINS</b> at <b>×2</b> multiplier.
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* =========================================================
   SYMBOLS & MATH
   ========================================================= */
const SYMBOLS = {
  diamond: { glyph:'💎', color:'#7fe3ff', name:'Diamond' },
  star:    { glyph:'⭐', color:'#ffd166', name:'Star'    },
  fire:    { glyph:'🔥', color:'#ff8a4c', name:'Fire'    },
  clover:  { glyph:'🍀', color:'#7dffb0', name:'Clover'  },
  bell:    { glyph:'🔔', color:'#ffe066', name:'Bell'    },
  cherry:  { glyph:'🍒', color:'#ff6b8b', name:'Cherry'  },
  scatter: { glyph:'🌀', color:'#c084fc', name:'Scatter' },
};
const ORDER   = ['diamond','star','fire','clover','bell','cherry','scatter'];
const WEIGHTS = { diamond:4, star:7, fire:9, clover:11, bell:13, cherry:15, scatter:3 };
const TOTAL_W = Object.values(WEIGHTS).reduce((a,b)=>a+b,0);

const PAYTABLE = {
  diamond: {3:0.50, 4:2.50, 5:10.0},
  star:    {3:0.30, 4:1.40, 5: 6.0},
  fire:    {3:0.20, 4:0.90, 5: 3.5},
  clover:  {3:0.15, 4:0.60, 5: 2.4},
  bell:    {3:0.10, 4:0.40, 5: 1.5},
  cherry:  {3:0.08, 4:0.25, 5: 1.0},
};
const SCATTER_PAY   = {3:2, 4:10, 5:50};
const SCATTER_SPINS = {3:10, 4:15, 5:25};

const BETS = [0.20, 0.50, 1, 2, 5, 10, 20];

/* =========================================================
   STATE
   ========================================================= */
const state = {
  balance: Number(localStorage.getItem('scatter.balance')) || 1000,
  betIndex: Number(localStorage.getItem('scatter.betIndex')) || 2,
  spinning: false,
  freeSpins: 0,
  freeMult: 2,
  autoTimer: null,
};
const getBet = () => BETS[state.betIndex];

/* =========================================================
   DOM
   ========================================================= */
const $ = id => document.getElementById(id);
const reelsEl   = $('reels');
const balanceEl = $('balance');
const balBox    = $('balBox');
const betAmtEl  = $('betAmt');
const spinBtn   = $('spinBtn');
const winMsg    = $('winMsg');
const fsBadge   = $('fsBadge');
const fsCount   = $('fsCount');
const modal     = $('modal');
const toastEl   = $('toast');

const fmt = n => '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});

/* =========================================================
   AUDIO
   ========================================================= */
let actx = null;
function ac(){
  if (!actx){
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function beep(freq, dur, type, vol, delay){
  const a = ac(); if (!a) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  spin(){ beep(180, 0.18, 'sawtooth', 0.05); beep(320, 0.14, 'sine', 0.04, 0.04); },
  stop(){ beep(520, 0.055, 'square', 0.05); },
  lose(){ beep(150, 0.13, 'sine', 0.045); },
  win(level){
    const notes = level >= 4 ? [523,659,784,1046,1318] : level >= 2 ? [523,659,784] : [659,880];
    notes.forEach((f,i) => beep(f, 0.20, 'triangle', 0.085, i * 0.075));
  },
  scatter(){ [392,523,659,784,1046].forEach((f,i)=>beep(f,0.26,'sine',0.09,i*0.085)); },
};

/* =========================================================
   LAYOUT
   ========================================================= */
let cellPx = 64;
function layout(){
  const vw = Math.min(window.innerWidth, 640);
  const vh = window.innerHeight;
  const gap = 8;
  let cell = Math.floor((vw - 60 - gap * 4) / 5);
  const maxByH = Math.floor((vh - 310) / 3);
  cell = Math.min(cell, maxByH);
  cell = Math.max(44, Math.min(cell, 92));
  cellPx = cell;
  document.documentElement.style.setProperty('--cell', cell + 'px');
  document.documentElement.style.setProperty('--gap', gap + 'px');
}

/* =========================================================
   REEL BUILD
   ========================================================= */
function cellHTML(sym){
  const s = SYMBOLS[sym];
  return `<div class="cell" data-sym="${sym}"><span class="glyph" style="color:${s.color}">${s.glyph}</span></div>`;
}

function buildReels(){
  reelsEl.innerHTML = '';
  for (let i = 0; i < 5; i++){
    const reel = document.createElement('div');
    reel.className = 'reel';
    reel.dataset.i = i;
    const strip = document.createElement('div');
    strip.className = 'strip';
    strip.innerHTML = cellHTML('cherry') + cellHTML('bell') + cellHTML('fire');
    reel.appendChild(strip);
    reelsEl.appendChild(reel);
  }
}
const reelEls = () => Array.from(reelsEl.children);

/* =========================================================
   RANDOM
   ========================================================= */
function pickSymbol(){
  let r = Math.random() * TOTAL_W;
  for (const k of ORDER){
    r -= WEIGHTS[k];
    if (r <= 0) return k;
  }
  return 'cherry';
}

function generateGrid(){
  const grid = [];
  for (let r = 0; r < 5; r++){
    const col = [];
    for (let c = 0; c < 3; c++) col.push(pickSymbol());
    grid.push(col);
  }
  return grid;
}

/* =========================================================
   EVALUATION
   ========================================================= */
function evaluate(grid){
  const wins = [];
  const scatterCells = [];

  for (let r = 0; r < 5; r++)
    for (let c = 0; c < 3; c++)
      if (grid[r][c] === 'scatter') scatterCells.push({ r, c });

  const scatterCount = scatterCells.length;
  if (scatterCount >= 3){
    wins.push({
      kind: 'scatter',
      cells: scatterCells,
      mult: SCATTER_PAY[Math.min(scatterCount, 5)]
    });
  }

  for (const sym of ['diamond','star','fire','clover','bell','cherry']){
    let len = 0, ways = 1;
    const cells = [];
    for (let r = 0; r < 5; r++){
      const rows = [];
      for (let c = 0; c < 3; c++) if (grid[r][c] === sym) rows.push(c);
      if (rows.length === 0) break;
      len++;
      ways *= rows.length;
      rows.forEach(c => cells.push({ r, c }));
    }
    if (len >= 3){
      wins.push({
        kind: 'line', symbol: sym, len, ways, cells,
        mult: PAYTABLE[sym][len] * ways
      });
    }
  }

  return { wins, scatterCount };
}

/* =========================================================
   REEL ANIMATION
   ========================================================= */
function spinReel(reelEl, finalSyms, duration){
  return new Promise(resolve => {
    const strip = reelEl.querySelector('.strip');
    const extra = 14;

    const seq = [];
    for (let i = 0; i < extra; i++) seq.push(pickSymbol());
    seq.push(...finalSyms);

    strip.style.transition = 'none';
    strip.innerHTML = seq.map(cellHTML).join('');
    strip.style.transform = 'translateY(0px)';
    reelEl.classList.add('spinning');

    void strip.offsetHeight; // force reflow

    strip.style.transition = `transform ${duration}ms cubic-bezier(0.16, 0.86, 0.24, 1)`;
    strip.style.transform = `translateY(-${extra * cellPx}px)`;

    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      strip.style.transition = 'none';
      strip.innerHTML = finalSyms.map(cellHTML).join('');
      strip.style.transform = 'translateY(0px)';
      reelEl.classList.remove('spinning');
      sfx.stop();
      resolve();
    };

    strip.addEventListener('transitionend', function onEnd(e){
      if (e.propertyName !== 'transform') return;
      strip.removeEventListener('transitionend', onEnd);
      finish();
    });

    setTimeout(finish, duration + 260); // safety net
  });
}

function animateSpin(grid){
  const reels = reelEls();
  const jobs = [];
  for (let i = 0; i < 5; i++){
    const dur = 680 + i * 145;
    jobs.push(spinReel(reels[i], grid[i], dur));
  }
  return Promise.all(jobs);
}

/* =========================================================
   HIGHLIGHTS
   ========================================================= */
function clearHighlights(){
  reelsEl.querySelectorAll('.cell.win').forEach(el => el.classList.remove('win'));
}

function highlightCells(cells){
  const reels = reelEls();
  for (const { r, c } of cells){
    const list = reels[r].querySelectorAll('.cell');
    if (list[c]) list[c].classList.add('win');
  }
}

/* =========================================================
   HUD
   ========================================================= */
function updateHUD(){
  balanceEl.textContent = fmt(state.balance);
  betAmtEl.textContent  = fmt(getBet());

  const free = state.freeSpins > 0;
  fsBadge.classList.toggle('show', free);
  fsCount.textContent = state.freeSpins;

  spinBtn.classList.toggle('free', free);
  spinBtn.querySelector('span').textContent = free ? 'FREE' : 'SPIN';

  if (state.spinning || (free === false && state.balance < getBet())) {
    spinBtn.disabled = true;
  } else {
    spinBtn.disabled = false;
  }

  $('betDown').disabled = state.spinning || state.betIndex === 0;
  $('betUp').disabled   = state.spinning || state.betIndex === BETS.length - 1;
}

function flashBalance(){
  balBox.classList.remove('flash');
  void balBox.offsetWidth;
  balBox.classList.add('flash');
}

let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1700);
}

/* =========================================================
   SPIN
   ========================================================= */
async function spin(){
  if (state.spinning) return;

  if (state.autoTimer){ clearTimeout(state.autoTimer); state.autoTimer = null; }

  const isFree = state.freeSpins > 0;

  if (!isFree && state.balance < getBet()){
    toast('Not enough balance');
    return;
  }

  state.spinning = true;
  clearHighlights();
  winMsg.classList.remove('show', 'big');
  winMsg.textContent = '';

  if (isFree){
    state.freeSpins--;
  } else {
    state.balance -= getBet();
  }
  updateHUD();
  sfx.spin();

  const grid = generateGrid();
  await animateSpin(grid);

  const { wins, scatterCount } = evaluate(grid);
  const mult  = isFree ? state.freeMult : 1;
  const total = wins.reduce((a, w) => a + w.mult, 0) * getBet() * mult;

  if (total > 0){
    for (const w of wins) highlightCells(w.cells);
    state.balance += total;
    flashBalance();

    const best = wins.reduce((a, w) => Math.max(a, w.mult), 0);
    winMsg.textContent = 'WIN ' + fmt(total) + (mult > 1 ? '  ×' + mult : '');
    winMsg.classList.toggle('big', best >= 4);
    winMsg.classList.add('show');

    sfx.win(Math.min(best, 5));
  } else {
    sfx.lose();
  }

  // ---- Free spins trigger / retrigger ----
  if (scatterCount >= 3){
    const extra = SCATTER_SPINS[Math.min(scatterCount, 5)];
    state.freeSpins += extra;
    sfx.scatter();

    setTimeout(() => {
      winMsg.textContent = extra + ' FREE SPINS';
      winMsg.classList.add('show', 'big');
    }, 380);
  }

  state.balance = Math.round(state.balance * 100) / 100;
  localStorage.setItem('scatter.balance', String(state.balance));
  localStorage.setItem('scatter.betIndex', String(state.betIndex));

  state.spinning = false;
  updateHUD();

  // ---- Auto continue free spins ----
  if (state.freeSpins > 0){
    state.autoTimer = setTimeout(() => {
      if (state.freeSpins > 0 && !state.spinning) spin();
    }, 1550);
  }
}

/* =========================================================
   PAYTABLE MODAL
   ========================================================= */
function buildPaytable(){
  const body = $('ptBody');
  body.innerHTML = '';
  for (const sym of ['diamond','star','fire','clover','bell','cherry']){
    const s = SYMBOLS[sym];
    const p = PAYTABLE[sym];
    const row = document.createElement('div');
    row.className = 'pt-row';
    row.innerHTML = `
      <span class="pt-glyph" style="color:${s.color}">${s.glyph}</span>
      <span class="pt-name">${s.name}</span>
      <span class="pt-pays">${p[3]}× · ${p[4]}× · ${p[5]}×</span>
    `;
    body.appendChild(row);
  }
}

/* =========================================================
   EVENTS
   ========================================================= */
spinBtn.addEventListener('click', () => { ac(); spin(); });

$('betDown').addEventListener('click', () => {
  if (state.spinning || state.betIndex === 0) return;
  state.betIndex--;
  localStorage.setItem('scatter.betIndex', String(state.betIndex));
  beep(420, 0.05, 'square', 0.04);
  updateHUD();
});

$('betUp').addEventListener('click', () => {
  if (state.spinning || state.betIndex === BETS.length - 1) return;
  state.betIndex++;
  localStorage.setItem('scatter.betIndex', String(state.betIndex));
  beep(560, 0.05, 'square', 0.04);
  updateHUD();
});

$('infoBtn').addEventListener('click', () => modal.classList.add('show'));
$('closeModal').addEventListener('click', () => modal.classList.remove('show'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

document.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); if (!modal.classList.contains('show')) spin(); }
  if (e.code === 'Escape') modal.classList.remove('show');
  if (e.code === 'ArrowUp')   $('betUp').click();
  if (e.code === 'ArrowDown') $('betDown').click();
});

window.addEventListener('resize', () => {
  layout();
  // keep current strips visible (they contain exactly 3 cells after a spin)
  reelEls().forEach(r => {
    const strip = r.querySelector('.strip');
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0px)';
  });
});

/* =========================================================
   BOOT
   ========================================================= */
layout();
buildReels();
buildPaytable();
updateHUD();

})();
</script>
